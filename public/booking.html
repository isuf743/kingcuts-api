<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Cuts — Konfirmim Rezervimi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#1a1208;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border-radius:12px;max-width:420px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card-header{background:linear-gradient(135deg,#1a1208,#2e2518);padding:2rem;text-align:center}
.logo{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:700;color:#c9a84c;letter-spacing:.15em}
.logo-sub{color:rgba(255,240,210,.5);font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;margin-top:.3rem}
.check-icon{width:70px;height:70px;background:linear-gradient(135deg,#c9a84c,#F5C842);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:1.5rem auto 0;font-size:2rem}
.card-body{padding:2rem}
.status-badge{display:inline-flex;align-items:center;gap:.5rem;background:#e8f8ed;color:#27ae60;border:2px solid #a8d5b5;border-radius:20px;padding:.5rem 1.2rem;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:1.5rem}
.title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:#1a1208;margin-bottom:.3rem}
.subtitle{color:#9e8c70;font-size:.85rem;margin-bottom:1.5rem}
.details{background:#f7f3ec;border:2px solid #e8d8a8;border-radius:8px;overflow:hidden;margin-bottom:1.5rem}
.detail-row{display:flex;padding:.9rem 1.2rem;border-bottom:1px solid #e8d8a8}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#9e8c70;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;width:90px;flex-shrink:0}
.detail-value{color:#1a1208;font-size:.9rem;font-weight:600}
.footer-note{background:linear-gradient(135deg,#fffbf0,#fff8e1);border:2px solid #e8d8a8;border-radius:8px;padding:1rem;text-align:center;font-size:.8rem;color:#9e8c70;margin-bottom:1rem}
.footer-note strong{color:#c9a84c}
.btn-home{display:block;width:100%;padding:1rem;background:linear-gradient(135deg,#c9a84c,#a8742a);color:#1a1208;border:none;border-radius:6px;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:center;text-decoration:none}
.error-state{text-align:center;padding:2rem;color:#9e8c70}
.error-state .error-icon{font-size:3rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo">✂ KING CUTS</div>
    <div class="logo-sub">Salloni Premium</div>
    <div class="check-icon">✓</div>
  </div>
  <div class="card-body" id="card-body">
    <div style="text-align:center;color:#9e8c70;padding:1rem">Duke ngarkuar...</div>
  </div>
</div>

<script>
function getParam(name){
  var url = new URLSearchParams(window.location.search);
  return url.get(name) || '';
}

var id   = getParam('id');
var srv  = getParam('srv');
var brb  = getParam('brb');
var date = getParam('date');
var time = getParam('time');

var body = document.getElementById('card-body');

if(!id || !srv){
  body.innerHTML = '<div class="error-state"><div class="error-icon">⚠</div><p>QR kodi nuk është i vlefshëm ose ka skaduar.</p></div>';
} else {
  // Verifiko rezervimin me API
  fetch('https://kingcuts-api-production.up.railway.app/api.php?action=get_bookings&id='+id)
  .then(function(r){ return r.json(); })
  .then(function(rows){
    var booking = null;
    if(Array.isArray(rows)){
      booking = rows.find(function(b){ return String(b.id) === String(id); });
    }
    
    var status = booking ? booking.status : 'confirmed';
    var clientName = booking ? booking.client_name : '—';
    var statusColors = {
      confirmed: {bg:'#e8f8ed',color:'#27ae60',border:'#a8d5b5',label:'✔ Konfirmuar'},
      completed: {bg:'#e8f0f8',color:'#2980b9',border:'#a8c5e0',label:'🏆 Përfunduar'},
      cancelled: {bg:'#fff0f0',color:'#e74c3c',border:'#f5c0c0',label:'✕ Anuluar'},
      pending:   {bg:'#fff8e1',color:'#f39c12',border:'#f0c040',label:'⏳ Në Pritje'}
    };
    var sc = statusColors[status] || statusColors.confirmed;
    
    body.innerHTML = 
      '<div style="text-align:center;margin-bottom:1.5rem">' +
        '<div class="status-badge" style="background:'+sc.bg+';color:'+sc.color+';border-color:'+sc.border+'">'+sc.label+'</div>' +
        '<div class="title">Rezervimi #'+id+'</div>' +
        '<div class="subtitle">'+clientName+'</div>' +
      '</div>' +
      '<div class="details">' +
        '<div class="detail-row"><span class="detail-label">✂ Shërbimi</span><span class="detail-value">'+srv+'</span></div>' +
        '<div class="detail-row"><span class="detail-label">👤 Berberi</span><span class="detail-value">'+brb+'</span></div>' +
        '<div class="detail-row"><span class="detail-label">📅 Data</span><span class="detail-value">'+date+'</span></div>' +
        '<div class="detail-row"><span class="detail-label">🕐 Ora</span><span class="detail-value">'+time+'</span></div>' +
      '</div>' +
      '<div class="footer-note">Trego këtë faqe në sallon.<br>Kodi unik: <strong>#KINGCUTS-'+id+'</strong></div>' +
      '<a href="https://kingcuts-api-production.up.railway.app" class="btn-home">← Kthehu në Website</a>';
  })
  .catch(function(){
    // Nëse API nuk përgjigjet, shfaq të dhënat nga URL
    body.innerHTML = 
      '<div style="text-align:center;margin-bottom:1.5rem">' +
        '<div class="status-badge">✔ Konfirmuar</div>' +
        '<div class="title">Rezervimi #'+id+'</div>' +
      '</div>' +
      '<div class="details">' +
        '<div class="detail-row"><span class="detail-label">✂ Shërbimi</span><span class="detail-value">'+srv+'</span></div>' +
        '<div class="detail-row"><span class="detail-label">👤 Berberi</span><span class="detail-value">'+brb+'</span></div>' +
        '<div class="detail-row"><span class="detail-label">📅 Data</span><span class="detail-value">'+date+'</span></div>' +
        '<div class="detail-row"><span class="detail-label">🕐 Ora</span><span class="detail-value">'+time+'</span></div>' +
      '</div>' +
      '<a href="https://kingcuts-api-production.up.railway.app" class="btn-home">← Kthehu në Website</a>';
  });
}
</script>
</body>
</html>
