<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING CUTS - Salloni Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf6ee;--bg2:#f3ece0;--bg3:#ede4d4;--card:#fff8ef;
  --gold:#a8742a;--gold2:#c9943e;--gold-light:#e8c070;--gold-pale:#f5e8c8;
  --dark:#1c160d;--dark2:#2e2518;--text:#2e2518;--muted:#7a6a50;--muted2:#9e8c70;
  --border:#d8c8a0;--border2:#e8d8b0;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--gold2);border-radius:3px}
.page{display:none;min-height:100vh;animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both}
.page.active{display:block}
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:0 3rem;height:68px;background:#1a1208;border-bottom:2px solid rgba(232,192,112,.2);box-shadow:0 2px 20px rgba(0,0,0,.4)}
.nav-logo{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.7rem;letter-spacing:.14em;color:#F5C842;cursor:pointer;text-shadow:0 0 20px rgba(245,200,66,.5);line-height:1;white-space:nowrap}
.nav-divider{width:1px;height:28px;background:rgba(232,192,112,.18);margin:0 .5rem}
.nav-center{display:flex;gap:0;list-style:none}
.nav-center a{color:rgba(245,237,224,.7);text-decoration:none;font-size:.76rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;transition:color .2s;cursor:pointer;padding:.4rem 1.1rem;display:block}
.nav-center a:hover,.nav-center a.nav-rezervo{color:#F5C842}
.nav-center a.nav-rezervo{font-weight:700}
.nav-right{display:flex;align-items:center}
.btn-nav{padding:.55rem 1.3rem;font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .25s;border-radius:2px;background:#F5C842;color:#1a1208;border:2px solid #F5C842}
.btn-nav:hover{background:#fff;border-color:#fff}
.hero{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#1a1208}
.hero-bg{position:absolute;inset:0;background:linear-gradient(160deg,#2a1e0a 0%,#1a1208 50%,#0f0a04 100%)}
.hero-pattern{position:absolute;inset:0;opacity:.06;background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,#e8c070 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,#e8c070 40px)}
.hero-content{position:relative;text-align:center;animation:fadeUp 1.1s cubic-bezier(.16,1,.3,1) both}
.hero-eyebrow{font-size:1rem;font-weight:800;letter-spacing:.25em;text-transform:uppercase;color:#FFD700;margin-bottom:1.6rem;display:flex;align-items:center;justify-content:center;gap:1rem;text-shadow:0 0 30px rgba(255,215,0,.8)}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';width:40px;height:2px;background:#FFD700}
.hero h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(4.5rem,13vw,12rem);line-height:.9;letter-spacing:.06em;color:#FFF;text-shadow:0 2px 4px rgba(0,0,0,1)}
.hero h1 span{color:#F0C060;font-style:italic;text-shadow:0 0 50px rgba(240,192,96,.6)}
.hero-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.1rem,2.2vw,1.6rem);color:#fff;margin-top:1.2rem;letter-spacing:.08em}
.hero-btns{margin-top:2.8rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.hero-cta{display:inline-flex;align-items:center;gap:.7rem;background:#F5C842;color:#1a1208;font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;padding:1.1rem 2.8rem;transition:all .3s;border:3px solid #F5C842;cursor:pointer;border-radius:3px;box-shadow:0 4px 28px rgba(245,200,66,.55)}
.hero-cta:hover{background:#fff;border-color:#fff;transform:translateY(-2px)}
.hero-cta.outline{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.7);color:#fff;font-weight:700}
.hero-cta.outline:hover{border-color:#F5C842;color:#1a1208;background:#F5C842}
.scroll-hint{position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:.9}
.scroll-hint span{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:#FFD700;font-weight:700}
.scroll-line{width:2px;height:45px;background:linear-gradient(to bottom,#FFD700,transparent);animation:scrollPulse 2s ease-in-out infinite}
.section-header{display:flex;align-items:baseline;gap:1.5rem;margin-bottom:4rem}
.section-num{font-family:'Cormorant Garamond',serif;font-size:4rem;color:#a8742a;opacity:.2;line-height:1;font-weight:700}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,4.5vw,3.8rem);letter-spacing:.04em;line-height:1.05;font-weight:700;color:#1a1208}
.section-title em{font-style:italic;color:#a8742a}
.home-section{padding:7rem 4rem;position:relative}
.home-section::before{content:'';position:absolute;top:0;left:4rem;right:4rem;height:1px;background:#d8c8a0}
.gallery-grid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:260px 260px;gap:4px;margin-top:3rem;border-radius:4px;overflow:hidden}
.gallery-item{overflow:hidden;position:relative;background:#ede4d4}
.gallery-item:first-child{grid-row:span 2}
.gallery-item img{width:100%;height:100%;object-fit:cover;filter:grayscale(10%) brightness(.88);transition:transform .7s,filter .4s}
.gallery-item:hover img{transform:scale(1.05);filter:grayscale(0%) brightness(.95)}
.goverlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(28,22,13,.7),transparent 55%);opacity:0;transition:opacity .35s;display:flex;align-items:flex-end;padding:1.2rem}
.gallery-item:hover .goverlay{opacity:1}
.goverlay span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;font-weight:600;color:#faf6ee}
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
.review-card{background:#fff;border:2px solid #2e2518;padding:2rem;transition:all .3s;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.review-card:hover{border-color:#c9943e;box-shadow:0 6px 24px rgba(168,116,42,.2);transform:translateY(-2px)}
.review-stars{color:#c9943e;font-size:1rem;letter-spacing:.12em;margin-bottom:1rem}
.review-text{font-size:.88rem;color:#2e2518;line-height:1.8;margin-bottom:1.5rem;font-style:italic}
.review-author{display:flex;align-items:center;gap:.8rem}
.review-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#a8742a,#c9943e);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:700;color:#fff}
.review-name{font-size:.88rem;font-weight:600;color:#1c160d}
.review-date{font-size:.74rem;color:#9e8c70}
.add-review-form{background:#fff;border:2px solid #2e2518;padding:2rem;border-radius:4px;margin-top:2rem}
.add-review-form h3{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:#1a1208;margin-bottom:.3rem}
.add-review-form p{font-size:.85rem;color:#5a4a38;margin-bottom:1.2rem}
.stars-input{display:flex;gap:.3rem;margin-bottom:1rem}
.star-btn{background:none;border:none;font-size:1.8rem;cursor:pointer;color:#d8c8a0;transition:color .2s;padding:0;line-height:1}
.star-btn.active{color:#c9943e}
.review-inputs{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.review-inputs input,.review-textarea{background:#f3ece0;border:2px solid #d8c8a0;color:#2e2518;padding:.85rem 1rem;font-family:'Outfit',sans-serif;font-size:.88rem;outline:none;transition:border-color .25s;border-radius:3px;width:100%}
.review-inputs input:focus,.review-textarea:focus{border-color:#a8742a;background:#fff}
.review-inputs input::placeholder,.review-textarea::placeholder{color:#9e8c70}
.review-textarea{resize:vertical;min-height:90px}
.btn-full{width:100%;padding:1.1rem;background:#F5C842;border:none;color:#1a1208;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .25s;margin-top:.3rem;border-radius:3px;box-shadow:0 4px 16px rgba(168,116,42,.4)}
.btn-full:hover{background:#a8742a;color:#fff}
.map-section{padding-bottom:0!important}
.map-layout{display:grid;grid-template-columns:1fr 1.6fr;align-items:stretch}
.map-info{padding:0 4rem 5rem 0;display:flex;flex-direction:column;justify-content:center}
.map-info h3{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:700;color:#a8742a;margin-bottom:1.8rem}
.map-detail{display:flex;gap:1rem;margin-bottom:1.4rem;align-items:flex-start}
.map-detail-icon{font-size:1.2rem;margin-top:.1rem}
.map-detail-text h4{font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#a8742a;margin-bottom:.3rem}
.map-detail-text p{font-size:.87rem;color:#7a6a50;line-height:1.75}
.map-embed iframe{width:100%;height:100%;min-height:450px;border:none;display:block}
footer{background:#1a1208;color:#f5ede0;padding:4rem;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:3rem;border-top:2px solid rgba(232,192,112,.2)}
.footer-logo{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:700;letter-spacing:.12em;color:#F5C842;display:block;margin-bottom:.7rem}
.footer-tagline{font-size:.88rem;color:rgba(255,240,210,.85);line-height:1.8;max-width:220px}
.footer-col h4{font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#F5C842;margin-bottom:1.2rem}
.footer-col a,.footer-col p{font-size:.92rem;color:rgba(255,240,210,.95);display:block;text-decoration:none;line-height:2.4;transition:color .25s;cursor:pointer}
.footer-col a:hover{color:#F5C842}
.footer-bottom{background:#0f0b06;padding:1.2rem 4rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(232,192,112,.12)}
.footer-bottom p{font-size:.78rem;color:rgba(255,240,210,.6);letter-spacing:.06em}
.booking-page{background:#f0e8d8;min-height:100vh;padding-top:68px}
.booking-header{background:#1a1208;padding:3rem 4rem 2.5rem;border-bottom:2px solid rgba(245,200,66,.25)}
.booking-header-inner{max-width:960px;margin:0 auto}
.progress-bar{display:flex;align-items:center;margin-bottom:2.5rem}
.progress-step{display:flex;align-items:center;gap:.7rem}
.step-circle{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:rgba(255,255,255,.35);transition:all .35s;font-family:'Outfit',sans-serif;flex-shrink:0}
.step-circle.done{background:#F5C842;border-color:#F5C842;color:#1a1208;font-weight:800}
.step-circle.active{border-color:#F5C842;color:#F5C842;background:rgba(245,200,66,.15);border-width:3px}
.step-label{font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);transition:color .35s;white-space:nowrap}
.step-label.active{color:#F5C842;font-weight:700}
.step-label.done{color:#F5C842}
.step-line{flex:1;height:2px;background:rgba(255,255,255,.15);margin:0 1rem;min-width:30px;border-radius:2px}
.step-line.done{background:#F5C842}
.booking-header h2{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,4vw,3rem);font-weight:700;color:#fff;margin-bottom:.4rem}
.booking-header p{font-size:.92rem;color:rgba(255,240,210,.9)}
.selection-bar{background:rgba(255,255,255,.1);border:1px solid rgba(245,200,66,.4);padding:1rem 1.5rem;margin-bottom:2rem;display:flex;gap:2rem;flex-wrap:wrap;align-items:center;border-radius:4px}
.sel-item{display:flex;align-items:center;gap:.5rem}
.sel-label{color:#F5C842;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;display:block}
.sel-val{color:#fff;font-weight:800;font-size:.92rem}
.booking-body{max-width:960px;margin:0 auto;padding:3rem 4rem 5rem;background:#f0e8d8}
.btn-back{display:inline-flex;align-items:center;gap:.5rem;background:#fff;border:2px solid #2e2518;color:#2e2518;font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.6rem 1.2rem;cursor:pointer;transition:all .25s;border-radius:3px;margin-bottom:2rem}
.btn-back:hover{border-color:#a8742a;background:#a8742a;color:#fff}
.pricing-tabs{display:flex;margin-bottom:2.5rem;width:fit-content;border-bottom:3px solid #2e2518}
.ptab{padding:.8rem 2rem;background:transparent;border:none;border-bottom:3px solid transparent;margin-bottom:-3px;color:#7a6a50;font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .25s}
.ptab.active{color:#1a1208;border-bottom:3px solid #a8742a;font-weight:800}
.ptab:hover:not(.active){color:#a8742a}
.pricing-panel{display:none}
.pricing-panel.active{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.2rem}
.price-card{background:#fff;border:2px solid #2e2518;padding:2rem;transition:all .3s;position:relative;overflow:hidden;border-radius:4px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.price-card:hover{border-color:#a8742a;box-shadow:0 8px 30px rgba(168,116,42,.25);transform:translateY(-3px)}
.price-card.selected-service{border-color:#a8742a;border-width:3px;background:linear-gradient(135deg,#fff8ef,#fdf0d5);box-shadow:0 0 0 4px rgba(168,116,42,.2)}
.price-card.featured{border-color:#a8742a;background:linear-gradient(135deg,#fff8ef,#fdf0d5)}
.price-badge{position:absolute;top:.8rem;right:.8rem;background:#a8742a;color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.25rem .6rem;border-radius:2px}
.price-icon{font-size:1.8rem;margin-bottom:1rem;display:block}
.price-name{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;margin-bottom:.4rem;color:#1a1208}
.price-desc{font-size:.83rem;color:#4a3a28;line-height:1.7;margin-bottom:1.2rem}
.price-val{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:#a8742a}
.price-duration{font-size:.76rem;color:#9e8c70;margin-left:.3rem;font-weight:400;font-family:'Outfit',sans-serif}
.select-btn{display:block;width:100%;margin-top:1rem;padding:.75rem;background:#e8d8a8;color:#7a6a50;border:2px solid #d8c8a0;font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .25s}
.price-card.selected-service .select-btn{background:#F5C842;color:#1a1208;border-color:#a8742a;font-weight:800}
.select-btn:hover{background:#a8742a;color:#fff;border-color:#a8742a}
.barbers-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
.barber-card{background:#fff;border:2px solid #2e2518;border-radius:6px;overflow:hidden;cursor:pointer;transition:all .3s;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.barber-card:hover{border-color:#a8742a;box-shadow:0 8px 28px rgba(168,116,42,.25);transform:translateY(-3px)}
.barber-card.selected-barber{border-color:#a8742a;border-width:3px;box-shadow:0 0 0 4px rgba(168,116,42,.2)}
.barber-photo{width:100%;height:200px;object-fit:cover;object-position:top;filter:grayscale(10%);transition:filter .4s}
.barber-card:hover .barber-photo,.barber-card.selected-barber .barber-photo{filter:grayscale(0%)}
.barber-info{padding:1.2rem}
.barber-name{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:#1a1208;margin-bottom:.2rem}
.barber-role{font-size:.72rem;color:#a8742a;text-transform:uppercase;letter-spacing:.14em;font-weight:700;margin-bottom:.6rem}
.barber-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem}
.barber-tag{background:#f5e8c8;border:1px solid #d8c8a0;color:#a8742a;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.22rem .6rem;border-radius:2px}
.barber-exp{font-size:.78rem;color:#5a4a38;font-weight:500}
.barber-check{display:none;width:100%;padding:.8rem;background:#F5C842;color:#1a1208;border:none;font-family:'Outfit',sans-serif;font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .25s}
.barber-card.selected-barber .barber-check{display:block}
.barber-check:hover{background:#a8742a;color:#fff}
.cal-confirm-layout{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:start}
.cal-wrap{background:#fff;border:2px solid #2e2518;padding:2rem;border-radius:6px}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem}
.cal-month{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;letter-spacing:.08em;color:#1a1208}
.cal-nav{background:#f5e8c8;border:2px solid #d8c8a0;color:#a8742a;width:2.2rem;height:2.2rem;cursor:pointer;font-size:1rem;transition:all .25s;display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:700}
.cal-nav:hover{background:#a8742a;color:#fff;border-color:#a8742a}
.cal-days-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.cal-day-name{text-align:center;font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9e8c70;padding:.4rem 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.84rem;font-weight:500;cursor:pointer;transition:all .2s;position:relative;border:2px solid transparent;border-radius:3px}
.cal-day:hover:not(.empty):not(.past){background:#f5e8c8;border-color:#d8c8a0;color:#a8742a}
.cal-day.empty,.cal-day.past{cursor:default;opacity:.3;font-weight:300}
.cal-day.today{border-color:#a8742a;color:#a8742a;font-weight:700}
.cal-day.selected{background:#a8742a;color:#fff;font-weight:700;border-color:#a8742a}
.cal-day.has-slots::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:#a8742a;border-radius:50%}
.cal-day.selected.has-slots::after{background:rgba(255,255,255,.8)}
.time-section{background:#fff;border:2px solid #2e2518;padding:1.8rem;border-radius:6px;margin-top:1.2rem}
.time-section h4{font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#a8742a;margin-bottom:1rem}
.no-date-msg{font-size:.88rem;color:#9e8c70;text-align:center;padding:2rem 0;font-style:italic}
.slots-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.slot{padding:.6rem;text-align:center;font-size:.8rem;font-weight:600;border:2px solid #d8c8a0;cursor:pointer;transition:all .22s;background:#f3ece0;border-radius:3px;color:#2e2518}
.slot:hover:not(.booked){border-color:#a8742a;color:#a8742a;background:#f5e8c8}
.slot.selected{background:#a8742a;color:#fff;border-color:#a8742a}
.slot.booked{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.confirm-form{background:#fff;border:2px solid #2e2518;padding:2rem;border-radius:6px}
.confirm-form h4{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:#1a1208;margin-bottom:1.2rem}
.fg{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.9rem}
.fg label{font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#a8742a}
.fg input{background:#f3ece0;border:2px solid #d8c8a0;color:#2e2518;padding:.85rem 1rem;font-family:'Outfit',sans-serif;font-size:.88rem;outline:none;transition:border-color .25s;border-radius:3px}
.fg input:focus{border-color:#a8742a;background:#fff}
.fg input.error{border-color:#e74c3c;background:#fff5f5}
.fg input::placeholder{color:#9e8c70}
.field-error{font-size:.72rem;color:#e74c3c;font-weight:500;margin-top:.2rem;display:none}
.field-error.show{display:block}
.summary-box{background:#f5e8c8;border:2px solid #d8c8a0;padding:1.4rem;border-radius:4px;margin-bottom:1.4rem}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;padding:.35rem 0;border-bottom:1px solid #e8d8b0}

.sdet-row span:first-child{color:#7a6a50}
.sdet-row span:last-child{font-weight:600;color:#1a1208}
.email-notice{background:rgba(168,116,42,.08);border:1px solid rgba(168,116,42,.2);border-radius:4px;padding:1rem 1.5rem;font-size:.84rem;color:#7a6a50;margin-bottom:1.5rem;display:flex;align-items:center;gap:.6rem}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:#1a1208;color:#fff;padding:1.5rem 2.5rem;font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:700;z-index:1000;opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);border-radius:8px;border:3px solid #F5C842;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;min-width:280px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.success{border-color:#27ae60;background:#1a3a1a}
.toast.error{border-color:#e74c3c;background:#3a1a1a}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes scrollPulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media(max-width:900px){

}

/* INTRO CINEMATIC */
#intro-screen{
  position:fixed;inset:0;z-index:99999;background:#0a0704;
  overflow:hidden;
}
#intro-screen.hidden{display:none;}

.intro-slide{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.2s ease;
}
.intro-slide.active{opacity:1;}

/* Ken Burns zoom effect */
.intro-slide.zoom-in{
  animation:kenBurnsIn 5s ease forwards;
}
.intro-slide.zoom-out{
  animation:kenBurnsOut 5s ease forwards;
}
@keyframes kenBurnsIn{
  from{transform:scale(1);} to{transform:scale(1.15);}
}
@keyframes kenBurnsOut{
  from{transform:scale(1.1);} to{transform:scale(1);}
}

/* Vignette */
.intro-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(10,7,4,.85) 100%);
  pointer-events:none;z-index:2;
}

/* Dark overlay animues */
.intro-overlay-dark{
  position:absolute;inset:0;background:#0a0704;
  opacity:1;transition:opacity 1s ease;z-index:3;pointer-events:none;
}
.intro-overlay-dark.clear{opacity:0;}

/* Logo */
.intro-logo{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;pointer-events:none;
}
.intro-logo-inner{
  text-align:center;transform:translateY(20px);opacity:0;
  transition:all 1.2s cubic-bezier(.16,1,.3,1);
}
.intro-logo-inner.show{transform:translateY(0);opacity:1;}
.intro-logo-text{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(3rem,8vw,6rem);font-weight:700;
  color:#c9a84c;letter-spacing:.3em;display:block;
  text-shadow:0 0 40px rgba(201,168,76,.5),0 2px 8px rgba(0,0,0,.8);
}
.intro-logo-line{
  width:60px;height:1px;background:linear-gradient(90deg,transparent,#c9a84c,transparent);
  margin:.8rem auto;
}
.intro-logo-sub{
  font-family:'Outfit',sans-serif;font-size:.75rem;
  color:rgba(255,240,210,.6);letter-spacing:.4em;text-transform:uppercase;display:block;
}
.intro-caption{
  position:absolute;bottom:3rem;left:50%;transform:translateX(-50%);
  text-align:center;z-index:10;pointer-events:none;
  opacity:0;transition:opacity 1s ease;
}
.intro-caption.show{opacity:1;}
.intro-caption p{
  font-family:'Outfit',sans-serif;font-size:.72rem;
  color:rgba(255,240,210,.5);letter-spacing:.2em;text-transform:uppercase;
  animation:captionPulse 2s ease-in-out infinite;
}
@keyframes captionPulse{0%,100%{opacity:.4;}50%{opacity:.9;}}

.intro-skip{
  position:absolute;top:1.5rem;right:1.5rem;z-index:20;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.5);padding:.4rem 1rem;border-radius:20px;
  font-family:'Outfit',sans-serif;font-size:.7rem;letter-spacing:.12em;
  cursor:pointer;transition:all .3s;text-transform:uppercase;
}
.intro-skip:hover{background:rgba(0,0,0,.6);color:rgba(255,255,255,.8);}

/* Progress bar */
.intro-progress{
  position:absolute;bottom:0;left:0;height:2px;
  background:linear-gradient(90deg,#c9a84c,#F5C842);

}

/* QR CODE */

<body>
<div id="intro-screen">
  <!-- Slide 1: Jashtë sallonit -->
  <div class="intro-slide" id="slide1" 
       style="background-image:url('/exterior.jpg')">
  </div>
  <!-- Slide 2: Brenda sallonit -->
  <div class="intro-slide" id="slide2"
       style="background-image:url('/interior.jpg')">
  </div>
  
  <div class="intro-vignette"></div>
  <div class="intro-overlay-dark" id="intro-dark"></div>
  
  <div class="intro-logo">
    <div class="intro-logo-inner" id="intro-logo-inner">
      <span class="intro-logo-text">KING CUTS</span>
      <div class="intro-logo-line"></div>
      <span class="intro-logo-sub">Salloni Premium · Tiranë</span>
    </div>
  </div>
  
  <div class="intro-caption" id="intro-caption">
    <p>✂ Klikoni për të hyrë</p>
  </div>
  
  <div class="intro-progress" id="intro-progress"></div>
  <button class="intro-skip" onclick="skipIntro()">Kalo →</button>
</div>

<div class="toast" id="toast"></div>

<script>
var booking = {service:'', price:'', duration:'', barber:'', barberId:0};
var userRating = 0;
var calDate = new Date();
var selDate = null;
var selSlot = null;
var selDateLabel = '';
var months = ['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nentor','Dhjetor'];
var barberPhotos = {
  'Artan Koci':'https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=400&q=80',
  'Blerim Hoxha':'https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=400&q=80',
  'Driton Shehu':'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=400&q=80',
  'Gentian Mema':'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=400&q=80'
};

function goPage(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  if(id==='p-calendar') renderCal();
  if(id==='p-barber'){
    document.getElementById('b-srv-name').textContent = booking.service||'--';
    document.getElementById('b-srv-dur').textContent  = booking.duration||'--';
    document.getElementById('b-srv-price').textContent= booking.price||'--';
    loadBarbersForBooking();
  }
}

function goHome(){
  goPage('p-home');
  setTimeout(function(){
    if(window.innerWidth<=900){
      document.querySelectorAll('#p-home .reveal').forEach(function(el){el.classList.add('visible');});
    } else {
      var ob=new IntersectionObserver(function(entries){
        entries.forEach(function(x){if(x.isIntersecting)x.target.classList.add('visible');});
      },{threshold:0.08});
      document.querySelectorAll('#p-home .reveal').forEach(function(el){el.classList.remove('visible');ob.observe(el);});
    }
  },80);
}

function scrollToSection(id){
  setTimeout(function(){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'});},100);
}

window.addEventListener('scroll',function(){
  document.getElementById('navbar').classList.toggle('scrolled',window.scrollY>60);
});

if(window.innerWidth<=900){
  document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('visible');});
} else {
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(x){if(x.isIntersecting)x.target.classList.add('visible');});
  },{threshold:0.08});
  document.querySelectorAll('.reveal').forEach(function(el){obs.observe(el);});
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast';
  if(msg.charAt(0)==='✓') t.classList.add('success');
  else if(msg.charAt(0)==='⚠') t.classList.add('error');
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3200);
}

function formatPhone(input){
  var v=input.value.replace(/[^\d+]/g,'');
  if(v.charAt(0)!=='+'){if(v.indexOf('355')===0)v='+'+v;else v='+355'+v.replace(/^0+/,'');}
  var d=v.replace(/\D/g,'');
  if(d.length<=3){input.value='+'+d;return;}
  var f='+'+d.slice(0,3);var r=d.slice(3);
  if(r.length>0)f+=' '+r.slice(0,2);
  if(r.length>2)f+=' '+r.slice(2,5);
  if(r.length>5)f+=' '+r.slice(5,9);
  input.value=f;
}

function switchPricing(cat){
  document.querySelectorAll('.ptab').forEach(function(t,i){t.classList.toggle('active',['basic','premium'][i]===cat);});
  document.querySelectorAll('.pricing-panel').forEach(function(p){p.classList.toggle('active',p.id==='price-'+cat);});
}

function selectService(card,name,price,dur){
  document.querySelectorAll('.price-card').forEach(function(c){c.classList.remove('selected-service');});
  card.classList.add('selected-service');
  booking.service=name; booking.price=price; booking.duration=dur;
}

function goToBarber(){
  if(!booking.service){showToast('⚠ Zgjidhni nje sherbim!');return;}
  goPage('p-barber');
}

function loadBarbersForBooking(){
  var grid=document.getElementById('barbers-grid-booking');
  if(!grid) return;
  grid.innerHTML='<div style="text-align:center;padding:2rem;color:#7a6a50;font-style:italic;grid-column:span 4">Duke ngarkuar...</div>';
  fetch('https://kingcuts-api-production.up.railway.app/api.php?action=get_barbers')
    .then(function(r){return r.json();})
    .catch(function(){
      return [
        {id:1,name:'Artan Koci',role:'Master Berber',experience:'12 vjet',specialties:'Fade, Klasik, Mjeker',active:'1'},
        {id:2,name:'Blerim Hoxha',role:'Senior Berber',experience:'8 vjet',specialties:'Modern, Skin Fade',active:'1'},
        {id:3,name:'Driton Shehu',role:'Berber',experience:'5 vjet',specialties:'Teksture, Curly',active:'1'},
        {id:4,name:'Gentian Mema',role:'Grooming Specialist',experience:'6 vjet',specialties:'Grooming, VIP',active:'1'}
      ];
    })
    .then(function(barbers){
      if(!Array.isArray(barbers)) barbers=[];
      var active=barbers.filter(function(b){return b.active==1||b.active==='1';});
      if(!active.length) active=barbers;
      if(!active.length){
        grid.innerHTML='<div style="padding:2rem;color:#e74c3c;grid-column:span 4">Nuk ka berber aktiv!</div>';
        return;
      }
      var html='';
      active.forEach(function(b){
        var photo=barberPhotos[b.name]||'https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=400&q=80';
        var tags=(b.specialties||'').split(',').map(function(t){return '<span class="barber-tag">'+t.trim()+'</span>';}).join('');
        var safeName=b.name.replace(/"/g,'&quot;');
        var safeRole=(b.role||'Berber').replace(/"/g,'&quot;');
        var safeExp=(b.experience||'').replace(/"/g,'&quot;');
        html+='<div class="barber-card" onclick="selectBarber(this)" data-barber-id="'+b.id+'" data-barber-name="'+safeName+'" data-barber-role="'+safeRole+'" data-barber-exp="'+safeExp+'">';
        html+='<img class="barber-photo" src="'+photo+'" alt="'+safeName+'">';
        html+='<div class="barber-info"><div class="barber-name">'+b.name+'</div><div class="barber-role">'+(b.role||'Berber')+'</div><div class="barber-tags">'+tags+'</div><div class="barber-exp">&#11088; '+(b.experience||'')+'</div></div>';
        html+='<button class="barber-check">Vazhdo &#8594; Zgjidh Daten</button>';
        html+='</div>';
      });
      grid.innerHTML=html;
    });
}

function selectBarber(card){
  var name=card.getAttribute('data-barber-name')||'';
  document.querySelectorAll('.barber-card').forEach(function(c){
    c.classList.remove('selected-barber');
    var b=c.querySelector('.barber-check');
    if(b) b.style.display='none';
  });
  card.classList.add('selected-barber');
  booking.barberId=parseInt(card.getAttribute('data-barber-id'))||0;
  booking.barber=name;
  selDate=null; selSlot=null;
  var b=card.querySelector('.barber-check');
  if(b){
    b.style.display='block';
    b.onclick=function(e){e.stopPropagation();goPage('p-calendar');};
  }
}

function renderCal(){
  var y=calDate.getFullYear(), m=calDate.getMonth();
  document.getElementById('cal-month-label').textContent=months[m]+' '+y;
  var first=new Date(y,m,1).getDay();
  var offset=first===0?6:first-1;
  var days=new Date(y,m+1,0).getDate();
  var today=new Date(); today.setHours(0,0,0,0);
  var html='';
  for(var i=0;i<offset;i++) html+='<div class="cal-day empty"></div>';
  for(var d=1;d<=days;d++){
    var date=new Date(y,m,d); date.setHours(0,0,0,0);
    var key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isPast=date<today, isSun=date.getDay()===0;
    var cls='cal-day';
    if(isPast||isSun) cls+=' past';
    if(date.getTime()===today.getTime()) cls+=' today';
    if(selDate===key) cls+=' selected';
    if(!isPast&&!isSun) cls+=' has-slots';
    if(!isPast&&!isSun){
      html+='<div class="'+cls+'" data-key="'+key+'" data-d="'+d+'" data-m="'+m+'" data-y="'+y+'" onclick="calDayClick(this)">'+d+'</div>';
    } else {
      html+='<div class="'+cls+'">'+d+'</div>';
    }
  }
  document.getElementById('cal-days').innerHTML=html;
  document.getElementById('c-srv-name').textContent=booking.service||'--';
  document.getElementById('c-brb-name').textContent=booking.barber||'--';
  document.getElementById('c-srv-price').textContent=booking.price||'--';
}

function calDayClick(el){
  selectDate(el.dataset.key,parseInt(el.dataset.d),parseInt(el.dataset.m),parseInt(el.dataset.y));
}

function selectDate(key,d,m,y){
  selDate=key; selSlot=null; selDateLabel=d+' '+months[m]+' '+y; renderCal();
  document.getElementById('slots-container').innerHTML='<div class="no-date-msg">Duke ngarkuar oret...</div>';
  document.getElementById('confirm-form').style.display='none';
  document.getElementById('waiting-msg').style.display='block';
  var times=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'];
  var now=new Date();
  var isToday=(y===now.getFullYear()&&m===now.getMonth()&&d===now.getDate());
  var barberParam=booking.barberId?'&barber_id='+booking.barberId:'';
  fetch('https://kingcuts-api-production.up.railway.app/api.php?action=get_booked_slots&date='+key+barberParam)
    .then(function(r){return r.json();})
    .catch(function(){return [];})
    .then(function(booked){
      if(!Array.isArray(booked)) booked=[];
      var shtml='<div class="slots-grid">';
      times.forEach(function(t){
        var parts=t.split(':');
        var th=parseInt(parts[0]),tm=parseInt(parts[1]);
        var isPastTime=isToday&&(th<now.getHours()||(th===now.getHours()&&tm<=now.getMinutes()));
        if(booked.indexOf(t)>=0||isPastTime){
          shtml+='<div class="slot booked">'+t+'</div>';
        } else {
          shtml+='<div class="slot" data-time="'+t+'" onclick="selectSlot(this)">'+t+'</div>';
        }
      });
      shtml+='</div>';
      document.getElementById('slots-container').innerHTML=shtml;
    });
}

function selectSlot(el){
  var time=el.dataset.time||el.textContent.trim();
  document.querySelectorAll('.slot').forEach(function(s){s.classList.remove('selected');});
  el.classList.add('selected'); selSlot=time;
  document.getElementById('sum-srv').textContent=booking.service||'--';
  document.getElementById('sum-brb').textContent=booking.barber||'--';
  document.getElementById('sum-date').textContent=selDateLabel;
  document.getElementById('sum-time').textContent=time;
  document.getElementById('sum-price').textContent=booking.price||'--';
  document.getElementById('confirm-form').style.display='block';
  document.getElementById('waiting-msg').style.display='none';
  setFieldError('inp-name','err-name',false);
  setFieldError('inp-phone','err-phone',false);
  setFieldError('inp-email','err-email',false);
}

function changeMonth(dir){
  calDate.setMonth(calDate.getMonth()+dir); selDate=null; selSlot=null; renderCal();
  document.getElementById('slots-container').innerHTML='<div class="no-date-msg">Zgjidhni daten per te pare oret e lira</div>';
  document.getElementById('confirm-form').style.display='none';
  document.getElementById('waiting-msg').style.display='block';
}

function validateName(v){return v.length>=2&&/^[a-zA-ZëËçÇ\s\-']+$/.test(v);}
function validatePhone(v){var d=v.replace(/\D/g,'');return /^3556[89]\d{7}$/.test(d);}
function validateEmail(v){return v===''||/^[a-zA-Z0-9._%+\-]+@gmail\.com$/.test(v);}
function setFieldError(inputId,errId,hasError){
  document.getElementById(inputId).classList.toggle('error',hasError);
  document.getElementById(errId).classList.toggle('show',hasError);
}

function submitBooking(){
  var name=document.getElementById('inp-name').value.trim();
  var phone=document.getElementById('inp-phone').value.trim();
  var email=document.getElementById('inp-email').value.trim();
  var valid=true;
  if(!validateName(name)){setFieldError('inp-name','err-name',true);valid=false;}else setFieldError('inp-name','err-name',false);
  if(!validatePhone(phone)){setFieldError('inp-phone','err-phone',true);valid=false;}else setFieldError('inp-phone','err-phone',false);
  if(!validateEmail(email)){setFieldError('inp-email','err-email',true);valid=false;}else setFieldError('inp-email','err-email',false);
  if(!valid){showToast('⚠ Kontrolloni fushat!');return;}
  if(!selDate||!selSlot){showToast('⚠ Zgjidhni daten dhe oren!');return;}
  document.getElementById('s-srv').textContent=booking.service;
  document.getElementById('s-brb').textContent=booking.barber||'--';
  document.getElementById('s-date').textContent=selDateLabel;
  document.getElementById('s-time').textContent=selSlot;
  document.getElementById('s-price').textContent=booking.price;
  document.getElementById('s-email-shown').textContent=email||'(nuk u dha)';
  fetch('https://kingcuts-api-production.up.railway.app/api.php?action=add_booking',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({client_name:name,client_phone:phone,client_email:email,barber_name:booking.barber,service_name:booking.service,price:booking.price,booking_date:selDate,booking_time:selSlot})
  }).then(function(r){return r.json();})
    .then(function(res){if(res.success){ lastBookingId = res.id; console.log('Rezervimi u ruajt! ID:'+res.id); } else console.log('Gabim:',res.error);})
    .catch(function(e){console.log('Error:',e);});
  if(email){
    fetch('https://kingcuts-api-production.up.railway.app/api.php?action=send_email',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({to_email:email,to_name:name,service:booking.service,barber:booking.barber,date:selDateLabel,time:selSlot,price:booking.price})
    }).then(function(r){return r.json();})
      .then(function(res){console.log(res.success?'Email u dergua!':'Email error: '+res.error);})
      .catch(function(e){console.log('Email error:',e);});
  }
  goPage('p-success');
  // Gjenero QR
  showQRCode(lastBookingId, booking.service, booking.barber, selDateLabel, selSlot);
  // Gjenero linqet e kalendarit
  generateCalendarLinks(booking.service, booking.barber, selDateLabel, selSlot, booking.price);
}

function setRating(val){
  userRating=val;
  document.querySelectorAll('.star-btn').forEach(function(b,i){b.classList.toggle('active',i<val);});
}

function submitReview(){
  var name=document.getElementById('rev-name').value.trim();
  var text=document.getElementById('rev-text').value.trim();
  var service=document.getElementById('rev-service').value.trim();
  if(!name||!text||!userRating){showToast('⚠ Plotesoni te gjitha fushat!');return;}
  fetch('https://kingcuts-api-production.up.railway.app/api.php?action=add_review',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name,text:text,rating:userRating,service:service})
  }).then(function(r){return r.json();})
  .then(function(res){
    if(res.success){
      loadReviews();
      document.getElementById('rev-name').value='';
      document.getElementById('rev-text').value='';
      document.getElementById('rev-service').value='';
      setRating(0);
      showToast('✓ Recensioni u publikua! Faleminderit!');
    } else {
      showToast('⚠ Gabim: '+res.error);
    }
  }).catch(function(){showToast('⚠ Gabim lidhje!');});
}

function loadReviews(){
  fetch('https://kingcuts-api-production.up.railway.app/api.php?action=get_reviews')
  .then(function(r){return r.json();})
  .then(function(reviews){
    if(!reviews.length) return;
    var grid=document.getElementById('reviews-grid');
    // Largo vetem reviews dinamike (jo ato statike)
    grid.querySelectorAll('.review-card.dynamic').forEach(function(c){c.remove();});
    reviews.forEach(function(rv){
      var stars='';
      for(var i=0;i<rv.rating;i++) stars+='&#9733;';
      for(var i=rv.rating;i<5;i++) stars+='&#9734;';
      var initials=rv.name.split(' ').map(function(w){return w.charAt(0);}).join('').slice(0,2).toUpperCase();
      var date=new Date(rv.created_at).toLocaleDateString('sq-AL',{day:'numeric',month:'long',year:'numeric'});
      var card=document.createElement('div');
      card.className='review-card dynamic';
      card.innerHTML='<div class="review-stars">'+stars+'</div><p class="review-text">'+rv.text+'</p><div class="review-author"><div class="review-avatar">'+initials+'</div><div><div class="review-name">'+rv.name+'</div><div class="review-date">'+date+'</div></div></div>';
      grid.prepend(card);
    });
  }).catch(function(){});
}

function resetAll(){
  booking={service:'',price:'',duration:'',barber:'',barberId:0};
  selDate=null; selSlot=null; calDate=new Date(); selDateLabel='';
  document.querySelectorAll('.price-card').forEach(function(c){c.classList.remove('selected-service');});
  document.getElementById('inp-name').value='';
  document.getElementById('inp-phone').value='';
  document.getElementById('inp-email').value='';
  document.querySelectorAll('.barber-card').forEach(function(c){c.classList.remove('selected-barber');});
  document.querySelectorAll('.slot-btn').forEach(function(b){b.classList.remove('selected');});
  goPage('p-home');
}

// ── INTRO CINEMATIC ──
var introTimer = null;
var introDone = false;

function skipIntro(){
  if(introDone) return;
  introDone = true;
  clearTimeout(introTimer);
  var intro = document.getElementById('intro-screen');
  intro.style.transition = 'opacity .8s ease';
  intro.style.opacity = '0';
  setTimeout(function(){ intro.classList.add('hidden'); }, 800);
  loadReviews();
}

function startIntro(){
  var slide1 = document.getElementById('slide1');
  var slide2 = document.getElementById('slide2');
  var dark = document.getElementById('intro-dark');
  var logo = document.getElementById('intro-logo-inner');
  var caption = document.getElementById('intro-caption');
  var progress = document.getElementById('intro-progress');
  
  var totalDuration = 7000; // ms
  
  // Progress bar
  progress.style.transition = 'width '+totalDuration+'ms linear';
  setTimeout(function(){ progress.style.width = '100%'; }, 100);
  
  // Hap dark overlay
  setTimeout(function(){
    dark.classList.add('clear');
    // Slide 1: jashtë - zoom in
    slide1.classList.add('active','zoom-in');
  }, 300);
  
  // Shfaq logo pas 1.5s
  setTimeout(function(){
    logo.classList.add('show');
  }, 1500);
  
  // Slide 2: brenda - pas 3.5s
  setTimeout(function(){
    slide1.style.transition = 'opacity 1.2s ease';
    slide1.style.opacity = '0';
    slide2.classList.add('active','zoom-out');
  }, 3500);
  
  // Caption pas 5s
  setTimeout(function(){
    caption.classList.add('show');
  }, 5000);
  
  // Auto-exit pas 7s
  introTimer = setTimeout(function(){
    skipIntro();
  }, totalDuration);
  
  // Klikim për të hyrë
  document.getElementById('intro-screen').addEventListener('click', function(e){
    if(e.target.classList.contains('intro-skip')) return;
    skipIntro();
  });
}

// ── CALENDAR ──
function generateCalendarLinks(service, barber, dateStr, timeStr, price){
  var months={'Janar':'01','Shkurt':'02','Mars':'03','Prill':'04','Maj':'05','Qershor':'06','Korrik':'07','Gusht':'08','Shtator':'09','Tetor':'10','Nentor':'11','Dhjetor':'12'};
  var parts=dateStr.split(' ');
  var day=parts[0].length===1?'0'+parts[0]:parts[0];
  var month=months[parts[1]]||'01';
  var year=parts[2]||new Date().getFullYear();
  var timeParts=timeStr.split(':');
  var hour=timeParts[0]||'10'; var min=timeParts[1]||'00';
  var startDT=year+month+day+'T'+hour+min+'00';
  var endHour=String(parseInt(hour)+(parseInt(min)+30>=60?1:0)).padStart(2,'0');
  var endMin=String((parseInt(min)+30)%60).padStart(2,'0');
  var endDT=year+month+day+'T'+endHour+endMin+'00';
  var title='King Cuts - '+service+' me '+barber;
  var desc='Rezervimi juaj ne King Cuts\nSherbimi: '+service+'\nBerberi: '+barber+'\nCmimi: '+price;
  var googleUrl='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+startDT+'/'+endDT+'&details='+encodeURIComponent(desc)+'&location='+encodeURIComponent('King Cuts, Tirane')+'&sf=true&output=xml';
  var ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nDTSTART:'+startDT+'\r\nDTEND:'+endDT+'\r\nSUMMARY:'+title+'\r\nDESCRIPTION:'+desc.replace(/\n/g,'\\n')+'\r\nLOCATION:King Cuts, Tirane\r\nSTATUS:CONFIRMED\r\nEND:VEVENT\r\nEND:VCALENDAR';
  var icsBlob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  var icsUrl=URL.createObjectURL(icsBlob);
  var gBtn=document.getElementById('cal-google');
  var aBtn=document.getElementById('cal-apple');
  if(gBtn) gBtn.href=googleUrl;
  if(aBtn){aBtn.href=icsUrl;aBtn.download='rezervimi-kingcuts.ics';}
}

// ── QR CODE ──
function generateQR(text){
  var img=document.getElementById('qr-img');
  var dl=document.getElementById('qr-download');
  if(!img) return;
  var url='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(text)+'&color=1a1208&bgcolor=ffffff&margin=10&format=png';
  img.src=url; img.style.display='block';
  if(dl){dl.href=url;dl.style.opacity='1';dl.style.pointerEvents='auto';dl.target='_blank';}
}

function showQRCode(bookingId, service, barber, date, time){
  var baseUrl='https://kingcuts-api-production.up.railway.app/booking.html';
  var params='?id='+bookingId+'&srv='+encodeURIComponent(service)+'&brb='+encodeURIComponent(barber)+'&date='+encodeURIComponent(date)+'&time='+encodeURIComponent(time);
  setTimeout(function(){ generateQR(baseUrl+params); },300);
}

// ── ANULIM ──
var lastBookingId=0;
function openCancelModal(){
  document.getElementById('cancel-phone').value='';
  document.getElementById('cancel-msg').style.display='none';
  document.getElementById('cancel-modal').classList.add('open');
}
function closeCancelModal(){ document.getElementById('cancel-modal').classList.remove('open'); }
function confirmCancel(){
  var phone=document.getElementById('cancel-phone').value.trim();
  var msg=document.getElementById('cancel-msg');
  if(!phone){msg.textContent='Shkruaj numrin!';msg.style.display='block';return;}
  phone=phone.replace(/[^0-9+]/g,'');
  if(phone.charAt(0)==='0') phone='+355'+phone.substring(1);
  if(phone.indexOf('355')===0) phone='+'+phone;
  if(!lastBookingId){msg.textContent='Rezervimi nuk u gjet!';msg.style.display='block';return;}
  msg.style.display='none';
  fetch('https://kingcuts-api-production.up.railway.app/api.php?action=cancel_booking_client',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:lastBookingId,phone:phone})
  }).then(function(r){return r.json();})
  .then(function(res){
    if(res.success){closeCancelModal();showToast('✓ Rezervimi u anulua!');setTimeout(function(){resetAll();},2000);}
    else{msg.textContent=res.error||'Numri nuk përputhet!';msg.style.display='block';}
  }).catch(function(){msg.textContent='Gabim lidhje!';msg.style.display='block';});
}

// ── INIT ──
window.addEventListener('load', function(){
  startIntro();
  loadReviews();
});

</script>
