<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Cuts — Admin</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.sidebar{width:220px;background:#111;color:#fff;position:fixed;height:100vh;padding:20px}
.nav-item{padding:10px;cursor:pointer}
.nav-item:hover{background:#333}
.main{margin-left:220px;padding:20px}
.section{display:none}
.section.active{display:block}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd;font-size:13px}
.btn{padding:6px 10px;background:#000;color:#fff;border:none;cursor:pointer}
input{padding:8px;width:100%;margin-bottom:10px}
.login{max-width:300px;margin:100px auto}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-page" class="login">
  <h2>Admin Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
  <p id="err" style="color:red"></p>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <div class="sidebar">
    <div class="nav-item" onclick="showSection('bookings',this)">Bookings</div>
    <div class="nav-item" onclick="showSection('logs',this)">Logs</div>
    <div class="nav-item" onclick="logout()">Logout</div>
  </div>

  <div class="main">

    <!-- BOOKINGS -->
    <div id="sec-bookings" class="section active">
      <h2>Bookings</h2>
      <div id="bookings"></div>
    </div>

    <!-- LOGS -->
    <div id="sec-logs" class="section">
      <h2>Logs</h2>
      <button class="btn" onclick="loadLogs()">All</button>
      <button class="btn" onclick="loadLogs('error')">Errors</button>
      <button class="btn" onclick="loadLogs('info')">Info</button>
      <div id="logs"></div>
    </div>

  </div>

</div>

<script>

// ================= CONFIG =================

const API = (location.hostname==='localhost')
  ? '/barber/api.php'
  : 'https://kingcuts-api-production.up.railway.app/api.php'

let token = localStorage.getItem('token') || ''

// ================= API =================

async function api(action, body=null){
  const res = await fetch(API+'?action='+action,{
    method: body ? 'POST':'GET',
    headers:{
      'Content-Type':'application/json',
      'Authorization': token
    },
    body: body ? JSON.stringify(body):null
  })

  const data = await res.json()

  if(data.error === 'Unauthorized'){
    logout()
  }

  return data
}

// ================= AUTH =================

async function login(){
  const u = user.value.trim()
  const p = pass.value.trim()

  const r = await api('admin_login',{username:u,password:p})

  if(r.success){
    token = r.token
    localStorage.setItem('token', token)
    start()
  }else{
    err.innerText = 'Login failed'
  }
}

function logout(){
  localStorage.removeItem('token')
  location.reload()
}

function start(){
  login-page.style.display='none'
  app.style.display='block'
  loadBookings()
}

// ================= NAV =================

function showSection(name,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'))
  document.getElementById('sec-'+name).classList.add('active')

  if(name==='logs') loadLogs()
}

// ================= BOOKINGS =================

async function loadBookings(){
  const data = await api('get_bookings')

  if(!Array.isArray(data)){
    bookings.innerHTML = 'Error'
    return
  }

  let html='<table><tr><th>ID</th><th>Name</th><th>Date</th><th>Time</th></tr>'

  data.forEach(b=>{
    html+=`<tr>
      <td>${b.id}</td>
      <td>${b.client_name}</td>
      <td>${b.booking_date}</td>
      <td>${b.booking_time}</td>
    </tr>`
  })

  html+='</table>'

  bookings.innerHTML = html
}

// ================= LOGS =================

async function loadLogs(level=''){
  logs.innerHTML='Loading...'

  const data = await api('get_logs'+(level?'&level='+level:''))

  if(!Array.isArray(data)){
    logs.innerHTML='Error'
    return
  }

  let html='<table><tr><th>Time</th><th>Level</th><th>Message</th><th>Context</th></tr>'

  data.forEach(l=>{
    html+=`<tr>
      <td>${l.created_at}</td>
      <td>${l.level}</td>
      <td>${l.message}</td>
      <td><pre>${JSON.stringify(l.context,null,2)}</pre></td>
    </tr>`
  })

  html+='</table>'

  logs.innerHTML = html
}

// ================= INIT =================

if(token){
  start()
}

</script>

</body>
</html>
