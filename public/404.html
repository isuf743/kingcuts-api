<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — King Cuts</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #c9a84c;
  --gold-light: #F5C842;
  --dark: #1a1208;
  --dark2: #2e2518;
  --cream: #faf6ee;
  --muted: rgba(255,240,210,.45);
}

html, body {
  height: 100%;
  background: var(--dark);
  color: var(--cream);
  font-family: 'Outfit', sans-serif;
  overflow: hidden;
}

/* NOISE TEXTURE */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: .4;
}

/* GOLD GLOW */
body::after {
  content: '';
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(201,168,76,.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.scene {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
}

/* SCISSORS ANIMATION */
.scissors-wrap {
  position: relative;
  margin-bottom: 2rem;
  animation: float 3s ease-in-out infinite;
}

.scissors {
  font-size: 4rem;
  display: block;
  animation: snip 2.5s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(201,168,76,.4));
}

@keyframes snip {
  0%, 100% { transform: rotate(-15deg) scale(1); }
  50% { transform: rotate(15deg) scale(1.1); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

/* 404 NUMBER */
.error-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(6rem, 20vw, 14rem);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.02em;
  color: transparent;
  -webkit-text-stroke: 2px var(--gold);
  position: relative;
  margin-bottom: .5rem;
  animation: fadeUp .8s cubic-bezier(.16,1,.3,1) both;
}

.error-num::after {
  content: '404';
  position: absolute;
  inset: 0;
  color: var(--gold);
  opacity: .08;
  transform: translate(4px, 4px);
  -webkit-text-stroke: 0;
}

/* DIVIDER */
.divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 1rem 0 1.5rem;
  animation: fadeUp .8s .1s cubic-bezier(.16,1,.3,1) both;
}

.divider-line {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.divider-icon {
  color: var(--gold);
  font-size: 1.2rem;
}

/* TEXT */
.error-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: 600;
  font-style: italic;
  color: var(--cream);
  margin-bottom: .7rem;
  animation: fadeUp .8s .15s cubic-bezier(.16,1,.3,1) both;
}

.error-sub {
  font-size: .9rem;
  color: var(--muted);
  max-width: 360px;
  line-height: 1.7;
  margin-bottom: 2.5rem;
  font-weight: 300;
  animation: fadeUp .8s .2s cubic-bezier(.16,1,.3,1) both;
}

/* BUTTONS */
.btns {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
  animation: fadeUp .8s .3s cubic-bezier(.16,1,.3,1) both;
}

.btn-primary {
  padding: .85rem 2rem;
  background: linear-gradient(135deg, var(--gold), #a8742a);
  color: var(--dark);
  border: none;
  border-radius: 3px;
  font-family: 'Outfit', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: none;
  transition: all .25s;
  position: relative;
  overflow: hidden;
}

.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  opacity: 0;
  transition: opacity .25s;
}

.btn-primary:hover::before { opacity: 1; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,.3); }
.btn-primary span { position: relative; z-index: 1; }

.btn-secondary {
  padding: .85rem 2rem;
  background: transparent;
  color: var(--muted);
  border: 1px solid rgba(201,168,76,.25);
  border-radius: 3px;
  font-family: 'Outfit', sans-serif;
  font-size: .8rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: none;
  transition: all .25s;
}

.btn-secondary:hover {
  color: var(--cream);
  border-color: rgba(201,168,76,.5);
  background: rgba(201,168,76,.05);
}

/* LOGO - top left */
.logo {
  position: fixed;
  top: 1.5rem;
  left: 2rem;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: .15em;
  text-decoration: none;
  z-index: 10;
  opacity: .7;
  transition: opacity .2s;
}
.logo:hover { opacity: 1; }

/* CORNER DECORATIONS */
.corner {
  position: fixed;
  width: 40px;
  height: 40px;
  opacity: .2;
}
.corner-tl { top: 1.5rem; right: 2rem; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
.corner-br { bottom: 1.5rem; left: 2rem; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }

/* BOTTOM TEXT */
.bottom-note {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: .7rem;
  color: rgba(255,240,210,.2);
  letter-spacing: .2em;
  text-transform: uppercase;
  white-space: nowrap;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .btns { flex-direction: column; align-items: center; }
  .btn-primary, .btn-secondary { width: 220px; text-align: center; }
}
</style>
</head>
<body>

<a href="/" class="logo">✂ KING CUTS</a>
<div class="corner corner-tl"></div>
<div class="corner corner-br"></div>

<div class="scene">

  <div class="scissors-wrap">
    <span class="scissors">✂</span>
  </div>

  <div class="error-num">404</div>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-icon">◆</span>
    <div class="divider-line"></div>
  </div>

  <h1 class="error-title">Kjo faqe nuk u gjet</h1>
  <p class="error-sub">Duket se floku që po kërkoni ra në tokë. Le t'ju çojmë mbrapsht ku duhet.</p>

  <div class="btns">
    <a href="/" class="btn-primary"><span>← Faqja Kryesore</span></a>
    <a href="/#rezervo" class="btn-secondary" onclick="history.back();return false;">Kthehu Mbrapsht</a>
  </div>

</div>

<div class="bottom-note">King Cuts &nbsp;·&nbsp; Salloni Premium &nbsp;·&nbsp; Tiranë</div>

</body>
</html>
